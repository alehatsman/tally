# CI for tally.
#
# One gate, not two. `provision apply tasks/ci.yml` is what a developer runs
# before a push and it is what runs here, so the two cannot drift: fmt,
# clippy, tests, rustdoc, cargo-deny, cargo-machete, lint-block drift, the
# comment budget and the soft caps all come from rust-quality at the pin in
# `tasks/tools.yml`.
#
# `clippy.toml` and `deny.toml` had been in the repo since M0 and nothing had
# ever read them. Now something does.
#
# What stays hand-written is the part the shared gate has no opinion about:
# this repo's system dependencies, and the one assertion that gave this file a
# reason to exist -- the tmux suite is allowed to skip on a contributor's
# machine and is not allowed to skip here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `midir` reaches ALSA on Linux, and `tmux` is what the integration
      # suite drives. Both are the point rather than incidental: the
      # device half must keep compiling, and the tmux half must actually
      # run.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev tmux
          tmux -V

      - name: Install provision
        run: cargo install --locked --git https://github.com/alehatsman/provision.git

      # Checks out rust-quality at the pin and installs nextest, deny and
      # machete. The pin lives in tasks/tools.yml and nowhere else.
      - name: Install the gate's tools
        run: provision apply tasks/tools.yml

      - name: Gate
        run: provision apply tasks/ci.yml

      # The suite is allowed to skip on a contributor's machine. It is not
      # allowed to skip here, and this is the only thing that can tell the
      # difference: a skip prints its banner to stderr and still exits 0,
      # so the exit code cannot be the check. The gate above already ran
      # this suite; what it cannot do is notice that it ran vacuously.
      - name: The tmux suite really ran
        run: |
          cargo test --test relocate -- --nocapture 2>&1 | tee /tmp/relocate.log
          if grep -q "SKIPPED" /tmp/relocate.log; then
            echo "::error::the tmux integration suite skipped in CI, which is the one place it must not"
            exit 1
          fi
